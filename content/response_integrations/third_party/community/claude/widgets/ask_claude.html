<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Claude - Ask Claude</title>
  <style>
    :root {
      --bg: #0f0f12; --panel: #16161b; --border: #2a2a33; --text: #e8e6e3; --dim: #8a8f98;
      --orange: #d97757; --green: #5fb865; --red: #e5534b; --yellow: #e3b341; --blue: #6ea8fe;
      --code-bg: #1b1b22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px 16px; background: var(--bg); color: var(--text);
      font: 13px/1.55 ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }
    .box { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; background: var(--panel); margin-bottom: 12px; }
    .box .title { display: flex; gap: 8px; align-items: baseline; }
    .brand { color: var(--orange); font-weight: 700; }
    .dim { color: var(--dim); }
    .turn { display: flex; gap: 10px; margin: 8px 0; }
    .turn > .glyph { flex: none; width: 1.2em; }
    .user { background: var(--code-bg); border-radius: 4px; padding: 6px 10px; color: var(--text); }
    .user > .glyph { color: var(--dim); }
    .assistant > .glyph { color: var(--orange); }
    .assistant > .body { flex: 1; min-width: 0; }
    .sub { display: flex; gap: 8px; margin: 2px 0 2px 1.2em; }
    .sub > .glyph { color: var(--dim); flex: none; }
    .sub > .body { flex: 1; min-width: 0; }
    .label { color: var(--dim); }
    .k-malicious { color: var(--red); font-weight: 700; }
    .k-suspicious { color: var(--yellow); font-weight: 700; }
    .k-benign { color: var(--green); font-weight: 700; }
    .k-inconclusive, .k-unknown { color: var(--dim); font-weight: 700; }
    .ok { color: var(--green); } .warn { color: var(--yellow); } .err { color: var(--red); }
    .footer { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--dim); }
    .md p { margin: 0 0 6px; white-space: pre-wrap; word-break: break-word; }
    .md h1, .md h2, .md h3 { font-size: 13px; font-weight: 700; margin: 8px 0 2px; color: var(--text); }
    .md ul, .md ol { margin: 2px 0 6px 1.4em; padding: 0; }
    .md li { margin: 1px 0; }
    .md code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
    .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; overflow: auto; white-space: pre; margin: 4px 0 8px; }
    .md pre code { background: none; padding: 0; }
    .md strong { font-weight: 700; } .md em { font-style: italic; }
    ul.plain { list-style: none; margin: 0; padding: 0; }
    ul.plain li { margin: 1px 0; }
    ul.plain li::before { content: "- "; color: var(--dim); }
    ol.plain { margin: 0; padding-left: 1.6em; }
    .empty { color: var(--dim); font-style: italic; }
    .mono-block { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div id="widget"></div>
  <script>
    // JSON placeholder [{stepInstanceName}.JsonResult]
    const data = [{stepInstanceName}.JsonResult];

    function esc(value) {
      return String(value === null || value === undefined ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // Minimal Markdown renderer for model output. Input is escaped first, so no raw HTML survives.
    function renderMarkdown(text) {
      const src = esc(text).replace(/\r\n/g, "\n");
      const lines = src.split("\n");
      const out = [];
      let inCode = false, codeBuf = [], list = null, para = [];
      const inline = (s) => s
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
      const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join("\n")) + "</p>"); para = []; } };
      const flushList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
      for (const raw of lines) {
        const line = raw.replace(/\s+$/, "");
        if (line.startsWith("```")) {
          if (inCode) { out.push("<pre><code>" + codeBuf.join("\n") + "</code></pre>"); codeBuf = []; inCode = false; }
          else { flushPara(); flushList(); inCode = true; }
          continue;
        }
        if (inCode) { codeBuf.push(line); continue; }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) { flushPara(); flushList(); out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); continue; }
        const ul = line.match(/^\s*[-*]\s+(.*)$/);
        const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
        if (ul || ol) {
          flushPara();
          const kind = ul ? "ul" : "ol";
          if (list !== kind) { flushList(); out.push("<" + kind + ">"); list = kind; }
          out.push("<li>" + inline((ul || ol)[1]) + "</li>");
          continue;
        }
        if (line.trim() === "") { flushPara(); flushList(); continue; }
        flushList();
        para.push(line);
      }
      if (inCode) out.push("<pre><code>" + codeBuf.join("\n") + "</code></pre>");
      flushPara(); flushList();
      return '<div class="md">' + out.join("") + "</div>";
    }

    function verdictClass(verdict) {
      return "k-" + String(verdict || "unknown").toLowerCase().replace(/[^a-z]/g, "");
    }

    function usageLine(result) {
      const usage = (result && result.usage) || {};
      const parts = [];
      if (result && result.model) parts.push(esc(result.model));
      if (usage.input_tokens !== undefined) parts.push(esc(usage.input_tokens) + " in / " + esc(usage.output_tokens) + " out tokens");
      if (result && result.stop_reason) parts.push(esc(result.stop_reason));
      return parts.join(" · ");
    }

    function header(subtitle) {
      return '<div class="box"><div class="title"><span class="brand">&#10043; Claude</span>' +
        (subtitle ? '<span class="dim">' + esc(subtitle) + "</span>" : "") + "</div></div>";
    }

    function userTurn(text) {
      return '<div class="turn user"><span class="glyph">&gt;</span><span class="body mono-block">' + esc(text) + "</span></div>";
    }

    function assistantTurn(bodyHtml) {
      return '<div class="turn assistant"><span class="glyph">&#9679;</span><div class="body">' + bodyHtml + "</div></div>";
    }

    function subLine(bodyHtml) {
      return '<div class="sub"><span class="glyph">&#9083;</span><div class="body">' + bodyHtml + "</div></div>";
    }

    function plainList(items, ordered) {
      if (!Array.isArray(items) || items.length === 0) return '<span class="empty">none</span>';
      const tag = ordered ? "ol" : "ul";
      return "<" + tag + ' class="plain">' + items.map((i) => "<li>" + esc(i) + "</li>").join("") + "</" + tag + ">";
    }

    function footer(result) {
      const line = usageLine(result);
      return line ? '<div class="footer">' + line + "</div>" : "";
    }

    function unwrap(data) {
      // Placeholders for entity actions arrive as a list; single results as an object.
      return data;
    }


    function render(result) {
      if (!result || typeof result !== "object" || Array.isArray(result)) {
        return header("") + '<p class="err">No response is available.</p>';
      }
      let html = header(result.model || "");
      if (result.prompt_preview) html += userTurn(result.prompt_preview);
      let body;
      if (result.structured_output !== undefined && result.structured_output !== null) {
        body = '<div class="md"><pre><code>' + esc(JSON.stringify(result.structured_output, null, 2)) + "</code></pre></div>";
      } else {
        body = renderMarkdown(result.response || "");
      }
      html += assistantTurn(body);
      if (result.is_truncated) html += subLine('<span class="warn">&#9888; response cut off by the max output tokens limit</span>');
      html += footer(result);
      return html;
    }

    document.getElementById("widget").innerHTML = render(unwrap(data));
  </script>
</body>
</html>
