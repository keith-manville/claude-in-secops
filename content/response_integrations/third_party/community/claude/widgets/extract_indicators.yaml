title: Claude - Extracted Indicators
type: html
scope: alert
action_identifier: Extract Indicators
description: Shows the indicators of compromise Claude extracted from the provided text, grouped by type. Output only, styled after the Claude Code terminal interface.
data_definition:
    html_height: 420
    safe_rendering: false
    widget_definition_scope: both
    type: html
condition_group:
    conditions:
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: '{stepInstanceName}'
        match_type: not_contains
    logical_operator: and
default_size: half_width
