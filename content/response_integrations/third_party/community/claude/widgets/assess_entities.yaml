title: Claude - Entity Assessments
type: html
scope: alert
action_identifier: Assess Entities
description: Shows the verdict, risk score, summary and recommended actions Claude produced for every assessed entity. Output only, styled after the Claude Code terminal interface.
data_definition:
    html_height: 460
    safe_rendering: false
    widget_definition_scope: both
    type: html
condition_group:
    conditions:
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: '{stepInstanceName}'
        match_type: not_contains
    logical_operator: and
default_size: half_width
